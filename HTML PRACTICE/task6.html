<!-- Task 6: Image and Internal Links
Create a webpage with an image gallery:
Use multiple <img> tags to display images
Each image should link to a larger version of the image or another related page -->

<!doctype html>
<html>
  <head>
    <title>Image Gallery</title>
  </head>
  <body>
    <h1>My Image Gallery</h1>

    <a href="images/profile.jpeg" target="_blank">
      <img src="images/profile.jpeg" alt="profile Image" width="150" />
    </a>

    <a href="images/photo-1471899236350-e3016bf1e69e.avif" target="_blank">
      <img
        src="images/photo-1471899236350-e3016bf1e69e.avif"
        alt="Flower Image"
        width="150"
      />
    </a>

    <a href="images/photo-1449824913935-59a10b8d2000.avif" target="_blank">
      <img
        src="images/photo-1449824913935-59a10b8d2000.avif"
        alt="City Image"
        width="150"
      />
    </a>
  </body>
</html>
