<!-- Text Analysis Tool
Task: Develop a tool that analyzes text input to calculate word frequency, average word length, and most common words.
Requirements:
Use array methods to process and manipulate text (e.g., split, map, reduce).
Display statistics such as word count, average word length, and list of common words.
Handle punctuation, case sensitivity, and special characters appropriately. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Analysis Tool</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Text Analysis Tool</h1>
    <div id="inputform">
      <label for="input">Enter the text :</label>
      <input type="text" id="input" />
      <button type="submit" id="submit_button">Submit</button>
    </div>
    <div class="container">
      <div>
        <div id="title_frequency"></div>
        <div id="frequency_word"></div>
      </div>

      <div id="avg">
        <div id="average_word_title"></div>
        <div id="average_count"></div>
      </div>

      <div id="commonn">
        <div id="commonword_title"></div>
        <div id="mostcommon_word"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
