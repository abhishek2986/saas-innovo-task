<!-- Calculator Application Task: Create a basic calculator application that can perform simple arithmetic operations. 
Requirements:
User Interface:
Input fields for entering two numbers.
Buttons for addition, subtraction, multiplication, and division.
A display area for showing the result.
Functionality:
Perform the selected arithmetic operation when the corresponding button is clicked.
Display the result in the result area.
Validate input to ensure numbers are entered -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Application Task: </title>
    <link rel="stylesheet" href="TASK2.css"/>
</head>
<body>
    <div id="container">
<h1>Calculator Application </h1>
<br>
    <div id="input_container">
        <label for="first_number">Enter a first number : </label>
        <input type="number" id="first_number"/>
        <label for="second_number">Enter a second number : </label>
        <input type="number" id="second_number"/>
    </div>
    <br>
    <br>
    <div id="button_container">
        <button type="submit" id="addtion">Addition
        </button>
        <button type="submit" id="substraction">Substraction</button>
        <button type="submit" id="division">
            Division
        </button>
        <button type="submit" id="multiplication">
            Multiplication
        </button>

        <button type="submit" id="RESET">
            Reset
        </button>
        
    </div>
    <div id="result">
        
    </div>
</div>

</div>
    <script src="TASK2.js"></script>
</body>
</html>
