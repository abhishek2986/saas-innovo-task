<!-- Guess the Number Game Task: Create a game where the user has to guess a randomly generated number within a certain range. 
Requirements:
User Interface:
An input field to enter the guess.
A button to submit the guess.
A display area to show hints (e.g., "Too high", "Too low") and the number of attempts.
Functionality:
Generate a random number between 1 and 100.
Check if the guess is correct and provide hints.
Track the number of attempts and display it.
Allow the user to play again after guessing correctly. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Guess the Number Game Task:</title>
    <link rel="stylesheet" href="TASK9.css"/>
</head>
<body>
    <h1>Guess the Number Game Task: </h1>
    <div id="container">
        <div id="inputform">
            <label for="inputtext">Enter the Number : </label>
            <input type="number" id="inputtext" />
            <button type="submit" id="submit">Submit Number</button>
        </div>
        <div id="suggestion"></div>
        <div id="score"></div>
        <div id="attempts"></div>
    </div>
    <script src="TASK9.js"> </script>
</body>
</html>
