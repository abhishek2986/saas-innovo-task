<!-- Task 5: Deprecated Tags
Create an HTML document using the <marquee> and <font> tags to demonstrate their attributes
Include scrolling text with the <marquee> tag
Style text using the <font> tag (note the tags are deprecated) -->

<!doctype html>
<html>
  <head>
    <title>Deprecated Tags Example</title>
  </head>
  <body>
    <h1>Deprecated HTML Tags</h1>

    <!-- Marquee Tag -->
    <marquee direction="left" scrollamount="5" bgcolor="lightblue">
      Welcome to my website!
    </marquee>

    <br /><br />

    <!-- Font Tag -->
    <font color="red" size="5" face="Arial">
      This text uses the deprecated font tag.
    </font>

    <br /><br />

    <font color="green" size="4" face="Verdana">
      HTML Font tag example with color, size, and font style.
    </font>
  </body>
</html>
