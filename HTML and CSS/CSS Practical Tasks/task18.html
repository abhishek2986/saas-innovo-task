<!-- Task 18: Flexbox Layout
Create a responsive layout using CSS Flexbox:
Design a flexible navigation bar with flex properties
Create a multi-column layout that adapts to different screen sizes -->

<!doctype html>
<html>
  <head>
    <title>Task 18: Flexbox Layout</title>

    <style>
      /* Navigation Bar */
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #333;
        color: white;
        padding: 15px;
      }

      .menu {
        display: flex;
        gap: 20px;
      }

      .menu a {
        color: white;
        text-decoration: none;
      }

      /* Multi Column Layout */
      .container {
        display: flex;
        gap: 20px;
        padding: 20px;
      }

      .box {
        flex: 1;
        background-color: lightblue;
        padding: 20px;
        text-align: center;
      }

      .menu a:hover {
        text-decoration: underline;
      }
      .menu a:active {
        color: #04aa6d;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        nav {
          flex-direction: column;
        }

        .menu {
          flex-direction: column;
          text-align: center;
          margin-top: 10px;
        }

        .container {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navigation Bar -->
    <nav>
      <h2>My Website</h2>

      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
      <div class="box">
        <h3>Column 1</h3>
        <p>This is the first column.</p>
      </div>

      <div class="box">
        <h3>Column 2</h3>
        <p>This is the second column.</p>
      </div>

      <div class="box">
        <h3>Column 3</h3>
        <p>This is the third column.</p>
      </div>
    </div>
  </body>
</html>
