<!-- Task 8: Table Creation
Create a table to display data:
Use <table>, <tr>, <td>, and <th> tags
Include headers for "Name", "Age", "Email"
Populate the table with sample data -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8: Table Creation</title>
</head>
<body>
  <table border="2" style="border-collapse: collapse">
  <tr>
    <th>name</th>
    <th>age</th>
    <th>email</th>
  </tr>
  <tr>
    <td>abhishek</td>
    <td>22</td>
    <td>a@gmail.com</td>
  </tr>
</table>

</body>
</html>
