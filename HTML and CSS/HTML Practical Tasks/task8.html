<!-- Task 8: Table Creation
Create a table to display data:
Use <table>, <tr>, <td>, and <th> tags
Include headers for "Name", "Age", "Email"
Populate the table with sample data -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8: Table Creation</title>
</head>
<body>

<table style="border: 2px solid black">
  <tr>
    <th style="border: 1px solid #0c0c0c; padding: 12px; text-align: left;" >name</th>
    <th  style="border: 1px solid #030303; padding: 12px; text-align: left;">age</th>
    <th  style="border: 1px solid #040404; padding: 12px; text-align: left;">email</th>
  </tr>
   <tr>
    <td style="border: 1px solid #0c0c0c; padding: 8px;">abhishek</td>
    <td style="border: 1px solid #0d0d0d; padding: 8px;"> 22</td>
    <td style="border: 1px solid #080808; padding: 8px;">a@gmail.com</td>
  </tr>
</table>

</body>
</html>
