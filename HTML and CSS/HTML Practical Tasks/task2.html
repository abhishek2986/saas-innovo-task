<!-- Create an HTML document with examples of block-level and inline elements:
Block-levelock-level elements: <div>, <h1>, <p>, <ul>, <li>
Inline elements: <span>, <a>, <strong>, <em>
Nest a list (<ul> with <li>) within another list -->

<!doctype html>
<html>
  <head>
    <title>Task 2: Block and Inline Elements
</title>
  </head>
  <body>
    <div>
      <h1>Student Profile</h1>
      <p>Name: <strong>John</strong></p>
      <p>Course: <em>Web Development</em></p>

      <ul>
        <li>
          Skills
          <ul>
            <li>HTML</li>
            <li>CSS</li>
          </ul>
        </li>
        <li>Hobbies</li>
      </ul>
    </div>

    <p>
      Visit my
      <a href="https://abhishek-patil-dev-portfolio.netlify.app/">portfolio</a>
      <span>for more details.</span>
    </p>
  </body>
</html>
