<!-- Task 6: Image and Internal Links
Create a webpage with an image gallery:
Use multiple <img> tags to display images
Each image should link to a larger version of the image or another related page -->

<!doctype html>
<html>
  <head>
    <title>Task 6: Image and Internal Links</title>
  </head>
  <body>
    <h1>My Image Gallery</h1>

    <a href="images/profile.jpeg" target="_blank">
      <img src="images/profile.jpeg" alt="profile Image" width="150" />
    </a>

    <a href="images/ganpati_visarjan.jpg" target="_blank">
      <img
        src="images/ganpati_visarjan.jpg" width="350"
        alt="Flower Image"
        width="290"
      />
    </a>

    <a href="images/ganesh.jpg" target="_blank">
      <img
        src="images/ganesh.jpg"
        alt="City Image"
        width="190"
      />
    </a>
  </body>
</html>
