<!-- Task 8: Implement a Flexbox Layout
Objective: Use CSS Flexbox to create a flexible layout with multiple columns.
Definitions:
Flexbox: A one-dimensional layout method in CSS for laying out items in rows or columns.
Flex Container: An element with display: flex that enables flexbox layout for its children. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 8: Implement a Flexbox Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 40px;
      }

      .container {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
      }

      .box {
        flex: 1;
        background-color: #4caf50;
        color: white;
        text-align: center;
        padding: 50px 20px;
        border-radius: 8px;
        font-size: 22px;
        font-weight: bold;
      }
      h1 {
        text-align: center;
        margin-bottom: 100px;
        color: #6a1010;
      }
    </style>
  </head>
  <body>
    <h1>
      Task8 : Use CSS Flexbox to create a flexible layout with multiple columns.
    </h1>
    <div class="container">
      <div class="box">Column 1</div>
      <div class="box">Column 2</div>
      <div class="box">Column 3</div>
    </div>
  </body>
</html>
