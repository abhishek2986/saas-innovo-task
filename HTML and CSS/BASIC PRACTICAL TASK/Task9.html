<!-- Task 9: Create a Dropdown Menu
Objective: Design a dropdown menu with CSS.
Definitions:
Dropdown Menu: A list of options that appears when a user interacts with a button or text.
CSS Positioning: The use of CSS properties like position, top, left, z-index to control the layout and stacking order of elements. -->

<!doctype html>
<html>
  <head>
    <title>Task 9: Create a Dropdown Menu</title>
    <style>
      .dropdown {
        position: relative;
        display: inline-block;
      }

      .menu {
        display: none;
        position: absolute;
        background: lightgray;
      }

      .dropdown:hover .menu {
        display: block;
      }

      .menu a {
        display: block;
        padding: 10px;
        text-decoration: none;
        color: black;
      }

      .menu a:hover {
        background: gray;
        color: white;
      }
      #dropdown_container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top: 200px;
      }

      #button {
        height: 50px;
        width: 100px;
      }
      h1 {
        color: #6a1010;
      }
    </style>
  </head>
  <body>
    <div id="dropdown_container">
      <h1>Task9 : Create a Dropdown Menu with CSS</h1>
      <div class="dropdown">
        <button id="button">Menu</button>

        <div class="menu">
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>
      </div>
    </div>
  </body>
</html>
