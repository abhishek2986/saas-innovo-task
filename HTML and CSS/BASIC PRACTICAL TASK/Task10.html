<!-- Task 10: Add Animations
Objective: Implement a simple CSS animation on a webpage element.
Definitions:
CSS Animation: A feature that allows the animation of HTML elements without using JavaScript or Flash.
Keyframes: The CSS at-rule @keyframes controls the intermediate steps in a CSS animation sequence. -->

<!doctype html>
<html>
  <head>
    <title>Task 10: Add Animations</title>
    <style>
      .box {
  width: 100px;
  height: 100px;
  background: blue;
  animation: move 3s infinite;
}

@keyframes move {
  0% {
    margin-left: 0;
  }

  50% {
    margin-left: 150px;
    background: green;
  }

  100% {
    margin-left: 300px;
    background: red;
  }
}

h1{
  color : #6a1010
}
    </style>
  </head>
  <body>
    <h1>Task10 : Implement a simple CSS animation on a webpage element.</h1>
    <div class="box"></div>
  </body>
</html>
