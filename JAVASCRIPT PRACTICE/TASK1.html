<!-- 1 . Task: Form Validation
Objective:
Create a form with dynamic validation that provides real-time feedback to users as they fill out the form. The goal is to enhance user experience by ensuring that form inputs meet specified criteria before submission. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Task: Form Validation</title>
    <link rel="stylesheet" href="TASK1.css"/>
</head>
<body>
            <h1>Registration Form</h1>

    <div class="formfiled">
<form id="form">

    <label>Name:</label>
    <input type="text" id="name">
    <small id="nameError"></small>

    <label>Email:</label>
    <input type="email" id="email">
    <small id="emailError"></small>

    <label>Password:</label>
    <input type="password" id="password">
    <small id="passwordError"></small>

    <label>Confirm Password:</label>
    <input type="password" id="conf_password">
    <small id="confirmError"></small>

    <br><br>

    <input type="submit" id="submit" value="Submit" disabled >

</form>

<p id="validation_message"></p>
    </div>
    <script src="TASK1.JS"></script>
</body>
</html>
<!-- User Interface:
Form Fields:
Name
Email
Password
Confirm Password
Validation Messages:
Real-time feedback messages for each field that indicate validation status.
Submit Button:
A button to submit the form (initially disabled until all fields are valid). -->
