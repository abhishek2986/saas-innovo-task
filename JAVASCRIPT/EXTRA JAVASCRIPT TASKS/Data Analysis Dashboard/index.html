<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <!-- load chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>📊 Sales Data Analysis Dashboard</h1>
    </header>

    <section class="filters">
      <select id="monthFilter">
        <option value="All">All Months</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
      </select>

      <select id="regionFilter">
        <option value="All">All Regions</option>
        <option>North</option>
        <option>South</option>
        <option>East</option>
        <option>West</option>
      </select>

      <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option>Electronics</option>
        <option>Furniture</option>
        <option>Accessories</option>
      </select>

      <input type="text" id="searchBox" placeholder="Search Product..." />
      <button id="resetBtn">Reset Filters</button>
    </section>

    <section class="cards">
      <div class="card">
        <h3>Total Sales</h3>
        <p id="totalSales">$0</p>
      </div>
      <div class="card">
        <h3>Total Profit</h3>
        <p id="totalProfit">$0</p>
      </div>
      <div class="card">
        <h3>Average Sales</h3>
        <p id="avgSales">$0</p>
      </div>
      <div class="card">
        <h3>Average Profit</h3>
        <p id="avgProfit">$0</p>
      </div>
      <div class="card">
        <h3>Highest Sale</h3>
        <p id="maxSale">$0</p>
      </div>
      <div class="card">
        <h3>Lowest Sale</h3>
        <p id="minSale">$0</p>
      </div>
    </section>

    <section class="charts">
      <div class="chart-box">
        <h2>Sales by Product</h2>
        <canvas id="barChart"></canvas>
      </div>
      <div class="chart-box">
        <h2>Monthly Sales</h2>
        <canvas id="lineChart"></canvas>
      </div>
      <div class="chart-box">
        <h2>Sales by Category</h2>
        <canvas id="pieChart"></canvas>
      </div>
      <div class="chart-box">
        <h2>Sales by Region</h2>
        <canvas id="doughnutChart"></canvas>
      </div>
    </section>

    <section class="table-section">
      <h2>Sales Records</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Month</th>
            <th>Region</th>
            <th>Category</th>
            <th>Product</th>
            <th>Sales</th>
            <th>Profit</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <script type="module" src="script.js"></script>
  </body>
</html>
