<!-- Practical Task: Product Listing Table
Objective: Create a product listing table with styled headers and alternating row colors using HTML and CSS.
Description: In this practical task, you will build a product listing table that includes columns for product name, description, price, and availability. You will use CSS to style the table headers, add alternating row colors, and highlight the table borders. This project will help you practice structuring data with HTML tables and styling them with CSS. -->

<!doctype html>
<html>
  <head>
    <title>Product Listing Table</title>
    <link rel="stylesheet" href="PRAC4.css" />
  </head>
  <body>
    <h2>Product Listing</h2>

    <table>
      <tr>
        <th>Product Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Availability</th>
      </tr>

      <tr>
        <td>Laptop</td>
        <td>15-inch screen</td>
        <td>₹50,000</td>
        <td>In Stock</td>
      </tr>

      <tr>
        <td>Mobile</td>
        <td>Android Phone</td>
        <td>₹20,000</td>
        <td>Out of Stock</td>
      </tr>

      <tr>
        <td>Headphones</td>
        <td>Wireless</td>
        <td>₹2,000</td>
        <td>In Stock</td>
      </tr>

      <tr>
        <td>Keyboard</td>
        <td>USB Keyboard</td>
        <td>₹800</td>
        <td>In Stock</td>
      </tr>
    </table>
  </body>
</html>
