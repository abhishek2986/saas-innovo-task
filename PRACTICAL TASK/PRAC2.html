<!-- Practical Task: Registration Form with HTML Validation
Objective: Create a user registration form with validation using HTML and CSS.
Description: In this practical task, you will build a registration form that includes fields for name, email, password, and confirm password. You will apply CSS to style the form and use basic HTML5 validation to ensure proper input. This project will help you understand form elements, attributes, and the application of CSS for form styling. -->
<!doctype html>
<html>
  <head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="PRAC2.css" />
  </head>
  <body>
    <div class="form">
      <h2>Registration Form</h2>

      <form>
        <label>Name</label><br />
        <input type="text" placeholder="Enter your name" required /><br /><br />

        <label>Email</label><br />
        <input
          type="email"
          placeholder="Enter your email"
          required
        /><br /><br />

        <label>Password</label><br />
        <input
          type="password"
          placeholder="Enter password"
          required
          minlength="6"
        /><br /><br />

        <label>Confirm Password</label><br />
        <input
          type="password"
          placeholder="Confirm password"
          required
          minlength="6"
        /><br /><br />

        <input type="submit" value="Register" />
      </form>
    </div>
  </body>
</html>
