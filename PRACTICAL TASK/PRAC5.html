<!-- Practical Task: Multi-Section Blog Page
Objective: Create a multi-section blog page using HTML5 semantic elements and CSS.
Description: In this practical task, you will create a blog page that includes a header, navigation bar, main content area with articles, and a footer. You will use HTML5 semantic elements like <header>, <nav>, <article>, and <footer>. CSS will be used to style the page and ensure a consistent layout. This project will help you understand the use of semantic HTML and CSS for page styling. -->

<!doctype html>
<html>
  <head>
    <title>My Blog</title>
    <link rel="stylesheet" href="PRAC5.css" />
  </head>
  <body>
    <header>
      <h1>My Blog</h1>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">Articles</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main>
      <article>
        <h2>First Blog Post</h2>
        <p>
          This is my first blog post. HTML5 semantic tags make web pages easy to
          understand.
        </p>
      </article>

      <article>
        <h2>Second Blog Post</h2>
        <p>
          CSS is used to add colors, spacing, and improve the design of a web
          page.
        </p>
      </article>
    </main>

    <footer>
      <p>© 2026 My Blog. All Rights Reserved.</p>
    </footer>
  </body>
</html>
