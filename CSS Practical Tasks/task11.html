<!-- Task 11: Text Styling
Style the text properties of an HTML document:
Change the font-family, font-size, and color
Use custom fonts by linking to an external font service like Google Fonts -->

<!doctype html>
<html>
  <head>
    <title>Task 11: Text Styling</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />

    <style>
      h1 {
        font-family: "Poppins", "Times New Roman";

        color: blue;
      }

      p {
        font-family: "Times New Roman";
        font-size: 18px;
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>Text Styling Example</h1>
    <p>This text uses a Google Font with custom size and color.</p>
  </body>
</html>
