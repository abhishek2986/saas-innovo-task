<!-- Task 1: Create a Simple Webpage Layout
Objective: Create a webpage with a header, navigation bar, main content area, and footer. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <link rel="stylesheet" href="P1.CSS" />
  </head>

  <body>
    <header>
      <h1>This is my portfolio</h1>

      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#project">Project</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="home">
        <h2>Home</h2>
        <p>Welcome to my portfolio.</p>
      </section>

      <section id="about">
        <h2>About</h2>
        <p>About me section.</p>
      </section>

      <section id="project">
        <h2>Projects</h2>
        <p>My projects section.</p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <p>Contact information.</p>
      </section>
    </main>

    <footer>
      <p>Copyright 2026</p>
    </footer>
  </body>
</html>
