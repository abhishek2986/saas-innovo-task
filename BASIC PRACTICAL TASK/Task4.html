<!-- Task 4: Create a Form with Styling
Objective: Design a user registration form with styled input fields and buttons. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Registration Form</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body design */
body {
    background-color: #f3f4f6;
    font-family: Arial, sans-serif;
}

/* Heading */
header {
    text-align: center;
    padding: 30px;
}

h1 {
    color: #e91e63;
}

/* Form box */
main {
    width: 400px;
    margin: auto;
}

form {
    background-color: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0px 5px 15px gray;
}

/* Text labels */
label {
    display: block;
    margin-bottom: 5px;
    color: #333;
}

/* Input boxes */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

/* Submit button */
input[type="submit"] {
    background-color: #e91e63;
    color: white;
    border: none;
    cursor: pointer;
}

/* Button hover */
input[type="submit"]:hover {
    background-color: #c2185b;
}

#tasktitle{
    text-align: center;
    color: #6a1010;
    margin-top: 25px;
    margin-bottom: 100px;
}
</style>
</head>

<body>
    <h1 id="tasktitle">Task4 : Design a user registration form with styled input fields and buttons.</h1>
    <header>
        <h1>Myntra Registration Form</h1>
    </header>

    <main>
        <form>
            <label for="name">Enter your name</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Enter your email</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="password">Enter your password</label>
            <input type="password" id="password" name="password">

            <br><br>

            <input type="submit" value="Submit">
        </form>
    </main>
</body>
</html>
