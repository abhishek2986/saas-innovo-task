<!-- Task 5: Implement a Navigation Bar
Objective: Create a navigation bar with styled links. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implement a Navigation Bar</title>
    <style> 
    body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background-color: #333;
            padding: 10px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav ul li a:hover {
            background-color: #575757;
        }

        nav ul li a:active {
            background-color: #04AA6D;
        }
        
        h1{
            text-align: center;
            margin-bottom: 2000px;
            color: #6a1010;
        }
        </style>
</head>
<body>
    <!-- <h1>Task5 : Create a navigation bar with styled links.</h1> -->
    <header>
        <nav>
           <ul>
            <li><a href="#" >Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        </nav>
    </header>
        <h1>Task5 : Create a navigation bar with styled links. ☝️</h1>

</body>
</html>
