<!-- Task 3: Build a Responsive Grid Layout -->
<!DOCTYPE html>
<html>
<head>
  <title>Responsive Grid Layout</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    padding: 20px;
}
.container{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;

}
.card {
background: linear-gradient(135deg, #667eea, #764ba2);    padding: 40px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

h1{
  text-align: center;
  color: #6a1010 ;
  margin-top: 25px;
  margin-bottom: 100px;
}
</style></head>
<body>
<h1>Task3 : Build a Responsive Grid Layout</h1>
  <div class="container">
    <div class="card">Item 1</div>
    <div class="card">Item 2</div>
    <div class="card">Item 3</div>
    <div class="card">Item 4</div>
    <div class="card">Item 5</div>
    <div class="card">Item 6</div>
     <div class="card">Item 7</div>
    <div class="card">Item 8</div>
    <div class="card">Item 9</div>
    <div class="card">Item 10</div>
    <div class="card">Item 11</div>
    <div class="card">Item 12</div>
  </div>

</body>
</html>
