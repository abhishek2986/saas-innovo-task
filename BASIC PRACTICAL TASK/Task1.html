<!-- Task 1: Create a Simple Webpage Layout
Objective: Create a webpage with a header, navigation bar, main content area, and footer. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Task 1: Create a Simple Webpage Layout</title>
<style>
  html {
  scroll-behavior: smooth;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  line-height: 1.6;
  background-color: #f4f4f4;
  color: #333;
}

header {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 20px;
}

nav {
  margin-top: 15px;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 15px;
  font-weight: bold;
}

nav a:hover {
  color: #ffd700;
}

section {
  min-height: 500px;
  padding: 40px 20px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

section h2 {
  margin-bottom: 15px;
}

section p {
  max-width: 600px;
  margin: 0 auto;
}

#home {
  background-color: white;
}

#about {
  background-color: #f9f9f9;
}

#project {
  background-color: white;
}

#contact {
  background-color: #f9f9f9;
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 15px;
}

</style>
  </head>

  <body>
    <header>
      <h1>This is my portfolio</h1>

      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#project">Project</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="home">
        <h2>Home</h2>
        <p>Welcome to my portfolio.</p>
      </section>

      <section id="about">
        <h2>About</h2>
        <p>About me section.</p>
      </section>

      <section id="project">
        <h2>Projects</h2>
        <p>My projects section.</p>
      </section>

      <section id="contact">
        <h2>Contact</h2>
        <p>Contact information.</p>
      </section>
    </main>

    <footer>
      <p>Copyright 2026</p>
    </footer>
  </body>
</html>
