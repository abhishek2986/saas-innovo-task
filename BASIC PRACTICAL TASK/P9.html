<!-- Task 9: Create a Dropdown Menu
Objective: Design a dropdown menu with CSS.
Definitions:
Dropdown Menu: A list of options that appears when a user interacts with a button or text.
CSS Positioning: The use of CSS properties like position, top, left, z-index to control the layout and stacking order of elements. -->
<!doctype html>
<html>
  <head>
    <title>Dropdown Menu</title>
    <link rel="stylesheet" href="P9.css" />
  </head>
  <body>
    <div class="dropdown">
      <button>Menu</button>

      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </body>
</html>
