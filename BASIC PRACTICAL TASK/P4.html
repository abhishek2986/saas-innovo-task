<!-- Task 4: Create a Form with Styling
Objective: Design a user registration form with styled input fields and buttons. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Registration Form</title>
    <link rel="stylesheet" href="P4.css"/>
</head>

<body>
    <header>
        <h1>Myntra Registration Form</h1>
    </header>

    <main>
        <form>
            <label for="name">Enter your name</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Enter your email</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="password">Enter your password</label>
            <input type="password" id="password" name="password">

            <br><br>

            <input type="submit" value="Submit">
        </form>
    </main>
</body>
</html>
